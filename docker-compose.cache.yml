services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  db:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379

  app:
    depends_on:
      db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379

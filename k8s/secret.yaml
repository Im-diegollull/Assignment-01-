# La app hoy no maneja ningún valor sensible real: no hay autenticación, ni
# sesiones, ni tokens, ni credenciales de terceros (verificado: no hay
# os.Getenv de secretos en el código, no hay .env con valores reales
# committeados). Este Secret existe solo para dejar el PATRÓN listo para
# cuando eso cambie — ej. una clave de firma de sesión, el día que se agregue
# login.
apiVersion: v1
kind: Secret
metadata:
  name: book-review-secrets
  namespace: book-review-app
type: Opaque
stringData:
  SESSION_SECRET: "CHANGE-ME-placeholder-no-es-un-valor-real"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-review-app
  namespace: book-review-app
  labels:
    app.kubernetes.io/name: book-review-app
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: book-review-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: book-review-app
    spec:
      nodeSelector:
        bookreviews-storage: local
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: app
          # Imagen buildeada localmente desde el Dockerfile de la Fase 1:
          #   docker build -t bookreviews:local .
          # (el target por defecto, "final", es la última etapa del
          # Dockerfile).
          image: bookreviews:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: book-review-config
            - secretRef:
                name: book-review-secrets
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
            - name: media-data
              mountPath: /media
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-data
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data

services:
  db:
    build:
      context: .
      target: db-admin
    volumes:
      - sqlite-data:/data
    environment:
      DB_PATH: ${DB_PATH:-/data/app.db}

  app:
    build:
      context: .
      target: final
    depends_on:
      db:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      PORT: ${APP_PORT:-8080}
      DB_PATH: ${DB_PATH:-/data/app.db}
      MEDIA_ROOT: /media
    volumes:
      - sqlite-data:/data
      - media-data:/media

volumes:
  sqlite-data:
  media-data:
